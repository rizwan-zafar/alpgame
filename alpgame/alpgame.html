<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* Reset and base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Manrope', sans-serif;
      background: linear-gradient(135deg, #4e54c8, #8f94fb);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: #2d2d2d;
    }

    .glass-container {
      backdrop-filter: blur(18px);
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      width: 100%;
      max-width: 500px;
      padding: 30px;
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      text-align: center;
      color: white;
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .input-section {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      outline: none;
      font-size: 1rem;
      background: #fff;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    button.add-btn {
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      background: #ffffff;
      box-shadow: 4px 4px 10px #c3c8f7, -4px -4px 10px #ffffff;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }

    button.add-btn:hover {
      transform: scale(1.05);
    }

    .section {
      margin-bottom: 25px;
    }

    .section h2 {
      font-size: 1.1rem;
      margin-bottom: 10px;
      color: white;
    }

    ul {
      list-style: none;
    }

    li {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      padding: 12px 15px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s;
    }

    li:hover {
      transform: scale(1.01);
    }

    .task-text {
      font-size: 1rem;
      flex: 1;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .complete-btn {
      background-color: #38a169;
      color: white;
    }

    .undo-btn {
      background-color: #e53e3e;
      color: white;
    }

    .empty {
      font-style: italic;
      font-size: 0.9rem;
      color: #ddd;
      text-align: center;
    }
    .task-list {
  max-height: 200px;
  overflow-y: auto;
  padding-right: 5px;
}

/* Custom scrollbar styling */
.task-list::-webkit-scrollbar {
  width: 6px;
}

.task-list::-webkit-scrollbar-track {
  background: rgba(255, 255, 255, 0.1);
  border-radius: 10px;
}

.task-list::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.4);
  border-radius: 10px;
}

.task-list::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.6);
}

    @media (max-width: 540px) {
      .glass-container {
        padding: 20px;
      }

      h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>

<body>
  <div class="glass-container" x-data="{
      task: '',
      pendingTask: [],
      completedTask: []
    }" x-init="$watch('pendingTask', () => { task=''; $refs.input.focus(); })">
    <h1>📝 My Tasks</h1>

    <div class="input-section">
      <input x-ref="input" type="text" x-model="task" @keyup.enter="if(task.trim()) pendingTask.push(task.trim())"
        placeholder="Add a new task..." />
      <button class="add-btn" @click="if(task.trim()) pendingTask.push(task.trim())">Add</button>
    </div>

    <!-- <div class="section">
      <h2>📌 Pending</h2>
      <ul>
        <template x-if="pendingTask.length === 0">
          <p class="empty">No pending tasks.</p>
        </template>
        <template x-for="(t, index) in pendingTask" :key="index">
          <li>
            <span class="task-text" x-text="t"></span>
            <button class="btn complete-btn" @click="completedTask.push(t); pendingTask.splice(index,1)">Done</button>
          </li>
        </template>
      </ul>
    </div> -->

    <!-- <div class="section">
      <h2>✅ Completed</h2>
      <ul>
        <template x-if="completedTask.length === 0">
          <p class="empty">Nothing completed yet.</p>
        </template>
        <template x-for="(t, index) in completedTask" :key="index">
          <li>
            <span class="task-text" x-text="t"></span>
            <button class="btn undo-btn" @click="pendingTask.push(t); completedTask.splice(index,1)">Undo</button>
          </li>
        </template>
      </ul>
    </div> -->
    <div class="section">
      <h2>📌 Pending</h2>
      <div class="task-list">
        <template x-if="pendingTask.length === 0">
          <p class="empty">No pending tasks.</p>
        </template>
        <ul>
          <template x-for="(t, index) in pendingTask" :key="index">
            <li>
              <span class="task-text" x-text="t"></span>
              <button class="btn complete-btn" @click="completedTask.push(t); pendingTask.splice(index,1)">Done</button>
            </li>
          </template>
        </ul>
      </div>
    </div>
    
    <div class="section">
      <h2>✅ Completed</h2>
      <div class="task-list">
        <template x-if="completedTask.length === 0">
          <p class="empty">Nothing completed yet.</p>
        </template>
        <ul>
          <template x-for="(t, index) in completedTask" :key="index">
            <li>
              <span class="task-text" x-text="t"></span>
              <button class="btn undo-btn" @click="pendingTask.push(t); completedTask.splice(index,1)">Undo</button>
            </li>
          </template>
        </ul>
      </div>
    </div>
    

  </div>
</body>

</html>
