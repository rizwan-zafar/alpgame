<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alpine.js Example</title>
  <!-- Alpine.js CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body>
  <div x-data="{
    count: 5,
    student: { name: 'Zahra', age: 20 },
    studentList: ['Ali', 'Zahra', 'Ahmed'],
    students: [
      { name: 'Ali', age: 22 },
      { name: 'Zahra', age: 20 },
      { name: 'Ahmed', age: 21 }
    ]
  }">
    <h1 x-text="count"></h1>
    <h1 x-text="student.name"></h1>
    <h1 x-text="studentList[2]"></h1>
    <h1 x-text="students[2].age"></h1>
    <!-- looping now -->
    <template x-for="(student,index) in studentList" :key="index">
      <li x-text="student"></li>
    </template>

    <template x-for="(student,index) in students" :key="index">

      <li>
        <span x-text="student.name"></span>
        <span x-text="student.age"></span>
      </li>
    </template>


  </div>

</body>

</html>
